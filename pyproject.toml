[project]
name = "mini-claude"
version = "0.1.0"
description = "A mini Claude Code–style coding agent built with Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "python-dotenv",
    "langchain-openai",
]

[project.scripts]
mini-claude = "mini_claude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_claude"]